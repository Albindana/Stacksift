# Default values for the stacksift chart.
# Closed-beta (Gate 2) defaults. Override per-environment with values-beta.yaml.
#
# SECRETS ARE NOT IN THIS FILE. Create them out-of-band before `helm install`:
#   - Secret  `stacksift-secrets`     (from ~/.config/stacksift-deploy/secrets.env)
#   - Secret  `stacksift-realm`       (the Keycloak realm JSON, admin secret substituted)
#   - Secret  `stacksift-es-s3-creds` (ES snapshot S3 keys; only if backups enabled)
# See README.md and zhelpers/DEPLOY/10-cutover-and-smoketest.

global:
  namespace: project-07
  # Public base domain. Subdomains derived below.
  domain: dmdailydeals.com
  # Name of the pre-created Secret consumed (envFrom) by the .NET app + migrator.
  appSecretName: stacksift-secrets

# Hostnames (FQDNs) for each public surface.
hosts:
  app: app.dmdailydeals.com        # dashboard
  api: api.dmdailydeals.com        # REST + SignalR + ingest
  auth: auth.dmdailydeals.com      # Keycloak (OIDC issuer)
  marketing: dmdailydeals.com      # marketing apex
  marketingWww: www.dmdailydeals.com
  files: files.dmdailydeals.com    # MinIO public (presigned downloads)

ingress:
  className: nginx
  # cert-manager: use a namespaced ACME Issuer created by this chart (tls/issuer.yaml).
  # Set issuer.kind=ClusterIssuer + name=<shared> to use a cluster-wide one instead.
  tls:
    enabled: true

certIssuer:
  create: true            # create a namespaced ACME Issuer
  kind: Issuer            # or ClusterIssuer (then create: false, set name to the shared one)
  name: letsencrypt
  email: verify@dmdailydeals.com
  server: https://acme-v02.api.letsencrypt.org/directory          # prod
  # stagingServer used by issuer-staging (avoid LE rate limits during first runs)
  stagingServer: https://acme-staging-v02.api.letsencrypt.org/directory
  useStaging: false       # flip true for first issuance attempts, then false

images:
  registry: ghcr.io/drdtrn
  pullPolicy: IfNotPresent
  # api/migrator/postgres are runtime-configurable → use published sha tags as-is.
  api:        { repo: stacksift-api,       tag: sha-2cc40a3 }
  migrator:   { repo: stacksift-migrator,  tag: sha-2cc40a3 }
  postgres:   { repo: stacksift-postgres,  tag: sha-2cc40a3 }
  # frontend/marketing bake NEXT_PUBLIC_* at BUILD time → MUST be rebuilt for
  # dmdailydeals.com (CI baked *.stacksift.com). See zhelpers/DEPLOY/06.
  frontend:   { repo: stacksift-frontend,  tag: dmdailydeals }
  marketing:  { repo: stacksift-marketing, tag: dmdailydeals }

# ── Application tier ──────────────────────────────────────────────────────────
api:
  # Gate 2 = single replica with role "api" → runs web + Hangfire cron in one pod
  # (matches compose). To scale >1: set role "web" here and enable cronworker.
  replicas: 1
  role: api
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

cronworker:
  enabled: false          # not needed at 1 api replica; enable when api scales >1
  role: cronworker
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

frontend:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

marketing:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 96Mi }
    limits:   { memory: 192Mi }

# ── Stateful dependencies ─────────────────────────────────────────────────────
postgres:
  image: ""               # defaults to images.registry/postgres
  storage: 15Gi
  storageClass: longhorn
  backups:
    # true → keeps the baked archive_mode=on (the postgres.yaml command override
    # that forces archive_mode=off only renders when this is false), and renders
    # the pgBackRest stanza-create Job (Helm hook) + the full/diff backup CronJobs.
    # Requires the pre-created `secretName` Secret. The repo is the in-namespace
    # MinIO bucket `stacksift-pg-backup`. stanza-create + first archive are
    # verified at deploy-time (DEPLOY/10 + docs/runbooks/01).
    #
    # ⚠️ PREREQUISITE: MinIO must serve TLS. pgBackRest's S3 driver only speaks
    # HTTPS (no plain-http option; verify-tls=n only skips cert verification), so
    # against the default plain-http MinIO stanza-create fails with
    # "TLS error: wrong version number". Give MinIO a cert before enabling.
    enabled: false
    secretName: stacksift-pgbackrest   # holds: access-key, secret-key, cipher-pass
    s3:
      endpoint: minio:9000
      bucket: stacksift-pg-backup
      region: us-east-1
      uriStyle: path
      verifyTls: "n"      # in-namespace MinIO is plain http
    retention:
      full: 4
      diff: 14
      archive: 14
    schedule:
      full: "0 2 * * 0"   # Sunday 02:00 UTC
      diff: "0 2 * * 1-6"  # Mon–Sat 02:00 UTC
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { memory: 1Gi }
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 1Gi }

redis:
  image: redis:7-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

rabbitmq:
  image: rabbitmq:3-management-alpine
  storage: 3Gi
  storageClass: longhorn
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

minio:
  image: minio/minio:latest
  mcImage: minio/mc:latest
  storage: 15Gi
  storageClass: longhorn
  publicIngress: true     # files.dmdailydeals.com (presigned download URLs are browser-fetched)
  buckets: [stacksift-uploads, stacksift-es-backup, stacksift-pg-backup]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }
  # TLS for the backup path ONLY (surgical — does not touch the app/ES, which keep
  # using http://minio:9000). An nginx stream sidecar terminates TLS on :9443 and
  # forwards to MinIO's localhost:9000; the `minio` Service exposes it on :443.
  # pgBackRest (which can only speak HTTPS) connects to minio:443 with verify-tls=n.
  # cert-manager issues a self-signed leaf (pgBackRest skips verification, so no CA
  # distribution is needed). Default off; enabling adds an idle sidecar until
  # backups are turned on (which also needs the data-dir topology fix — see
  # zhelpers/DEPLOY/to-fix/minio-tls-plan.md §7).
  tls:
    enabled: false
    create: true                 # create the cert-manager self-signed cert
    proxyImage: nginx:1.27-alpine
    proxyPort: 9443              # sidecar listen port (Service maps 443 → here)
    certSecretName: minio-tls
    resources:
      requests: { cpu: 10m, memory: 24Mi }
      limits:   { memory: 64Mi }

elasticsearch:
  # SELF-HOSTED plain ES (not ECK — ECK forces security on, app has no ES auth).
  image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
  storage: 15Gi
  storageClass: longhorn
  heap: 1g
  lifecycle:
    # true → an initContainer loads the S3 keys into the ES keystore and the S3
    # client is pointed at MinIO (http); the app's EsLifecycleBootstrap then
    # registers the ILM policies + the `stacksift-es-backup` snapshot repo at
    # startup. false → plain ES (indices auto-create, no ILM/snapshots).
    # Repo register validates only against live ES+MinIO (deploy-time).
    enabled: false
    s3SecretName: stacksift-es-s3-creds   # keys: s3.client.default.access_key/secret_key
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { memory: 2Gi }

keycloak:
  # realm JSON (exported from compose `:latest`) uses fields newer than 26.0
  # (maxSecondaryAuthFailures, maxTemporaryLockouts, organizationsEnabled, …) →
  # must run a matching/newer Keycloak. `latest` matches the realm's origin.
  image: quay.io/keycloak/keycloak:latest
  realmSecretName: stacksift-realm   # pre-created Secret holding stacksift-realm.json
  storageClass: longhorn
  resources:
    requests: { cpu: 150m, memory: 384Mi }
    limits:   { memory: 768Mi }

# ── Migrations ────────────────────────────────────────────────────────────────
migrate:
  # post-install,post-upgrade Helm hook; waits for postgres then applies EF migrations.
  enabled: true
  backoffLimit: 4

# ── NetworkPolicy (namespaced; off by default — enable AFTER the app is up) ────
networkPolicy:
  # Calico is the CNI. When enabled: default-deny ingress for every pod, then
  # allow (a) all intra-namespace pod-to-pod and (b) ingress-nginx → the web tier.
  # Ship this AFTER first stand-up so a wrong selector can't lock you out
  # (zhelpers/DEPLOY/04 §6). Egress is NOT restricted here (the cluster may run a
  # GlobalNetworkPolicy for that — deploy-time concern).
  enabled: false
  # Namespace the ingress controller runs in — its pods are the only
  # cross-namespace source allowed to reach the web tier. The
  # kubernetes.io/metadata.name label is auto-applied to every namespace.
  ingressControllerNamespace: ingress-nginx

# ── Observability (optional; off by default for first stand-up) ────────────────
serviceMonitor:
  enabled: false          # legacy single api ServiceMonitor toggle (kept for compat)

# Minimal in-namespace Prometheus (Prometheus-Operator is available cluster-wide).
# When enabled: a namespaced Prometheus CR + its RBAC, ServiceMonitors for the
# api and rabbitmq, and a PrometheusRule with the 4 Gate-2 alerts. Grafana/Loki/
# Tempo are deferred to bucket B (first stand-up survives on `kubectl logs`).
prometheus:
  enabled: false
  retention: 7d
  storage: 5Gi            # PVC for the Prometheus TSDB
  storageClass: longhorn
  scrapeInterval: 30s
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { memory: 768Mi }
  # Enable only if a postgres-exporter sidecar/Deployment exposing :9187 exists.
  postgresExporter:
    enabled: false
    port: 9187
