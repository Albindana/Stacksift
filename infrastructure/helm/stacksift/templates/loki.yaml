{{- if .Values.loki.enabled }}
{{/* Loki single-binary (filesystem storage), mirrors infrastructure/docker/loki.
     Service loki:3100 — the app's Serilog sink pushes here and Grafana queries it.
     The ruler alertmanager_url is set only when Alertmanager is deployed. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels: {{- include "stacksift.labels" . | nindent 4 }}
data:
  loki-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: {{ .Values.loki.retentionHours }}h
      retention_period: {{ .Values.loki.retentionHours }}h
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: filesystem
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-tmp
      {{- if .Values.alertmanager.enabled }}
      alertmanager_url: http://alertmanager-operated:9093
      {{- end }}
      ring:
        kvstore:
          store: inmemory
      enable_api: true
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  selector: {{- include "stacksift.selector" (dict "ctx" . "component" "loki") | nindent 4 }}
  ports:
    - { name: http, port: 3100, targetPort: 3100 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "stacksift.selector" (dict "ctx" . "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "stacksift.selector" (dict "ctx" . "component" "loki") | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.loki.storageClass }}
  resources: { requests: { storage: {{ .Values.loki.storage }} } }
{{- end }}
