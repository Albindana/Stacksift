{{- if or .Values.serviceMonitor.enabled .Values.prometheus.enabled }}
{{/* Prometheus Operator ServiceMonitor for the API /metrics endpoint. Scraped by
     the namespaced Prometheus CR (observability.yaml) or any cluster Prometheus
     selecting this namespace + label. The relabeling pins job=stacksift-api so
     the ported PrometheusRule alert exprs match. See zhelpers/DEPLOY/08. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "stacksift.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.prometheus.scrapeInterval | default "30s" }}
      relabelings:
        - targetLabel: job
          replacement: stacksift-api
{{- end }}
