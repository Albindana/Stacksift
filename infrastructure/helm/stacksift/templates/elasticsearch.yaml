{{/* Elasticsearch — SELF-HOSTED single-node StatefulSet (NOT ECK).
     Why not ECK: ECK forces xpack.security on (auth + TLS), but the app's ES
     client is `new ElasticsearchClientSettings(new Uri(...))` with NO auth/TLS
     support (ServiceCollectionExtensions.cs:59). So we run plain http no-auth ES,
     exactly like docker-compose. Service `elasticsearch:9200`. */}}
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "stacksift.selector" (dict "ctx" . "component" "elasticsearch") | nindent 4 }}
  ports:
    - { name: http, port: 9200, targetPort: 9200 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: {{- include "stacksift.selector" (dict "ctx" . "component" "elasticsearch") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "stacksift.selector" (dict "ctx" . "component" "elasticsearch") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      {{- if .Values.elasticsearch.lifecycle.enabled }}
      initContainers:
        # Build the ES keystore with the S3 snapshot creds (the 8.x image bundles
        # repository-s3). The keystore is written to a shared emptyDir and mounted
        # into the main container's config dir via subPath.
        - name: keystore
          image: {{ .Values.elasticsearch.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              elasticsearch-keystore create
              printf '%s' "$S3_ACCESS_KEY" | elasticsearch-keystore add --stdin --force s3.client.default.access_key
              printf '%s' "$S3_SECRET_KEY" | elasticsearch-keystore add --stdin --force s3.client.default.secret_key
              cp /usr/share/elasticsearch/config/elasticsearch.keystore /keystore/elasticsearch.keystore
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.elasticsearch.lifecycle.s3SecretName }}, key: s3.client.default.access_key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.elasticsearch.lifecycle.s3SecretName }}, key: s3.client.default.secret_key } }
          volumeMounts:
            - { name: keystore, mountPath: /keystore }
      {{- end }}
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            # Longhorn block device: avoid the mmap vm.max_map_count node sysctl.
            - { name: node.store.allow_mmap, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms{{ .Values.elasticsearch.heap }} -Xmx{{ .Values.elasticsearch.heap }}" }
            - { name: cluster.name, value: stacksift }
            {{- if .Values.elasticsearch.lifecycle.enabled }}
            # Point the default S3 client at the plain-http in-namespace MinIO.
            - { name: s3.client.default.protocol, value: "http" }
            - { name: s3.client.default.endpoint, value: "minio:9000" }
            {{- end }}
          ports:
            - { name: http, containerPort: 9200 }
          readinessProbe:
            httpGet:
              path: "/_cluster/health?wait_for_status=yellow&timeout=1s"
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources: {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
            {{- if .Values.elasticsearch.lifecycle.enabled }}
            - { name: keystore, mountPath: /usr/share/elasticsearch/config/elasticsearch.keystore, subPath: elasticsearch.keystore }
            {{- end }}
      {{- if .Values.elasticsearch.lifecycle.enabled }}
      volumes:
        - { name: keystore, emptyDir: {} }
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.elasticsearch.storageClass }}
        resources: { requests: { storage: {{ .Values.elasticsearch.storage }} } }
