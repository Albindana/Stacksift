{{- if .Values.postgres.backups.enabled }}
{{/* One-time pgBackRest stanza-create + check (modelled on the compose
     `pgbackrest-init` profile). Runs as a post-install/post-upgrade Helm hook
     AFTER minio-init (-10) and migrate (-5) so MinIO + the bucket exist; an
     initContainer waits for postgres. The archive_command fails loudly until
     this stanza exists, so it must run before WAL archiving is relied on.
     stanza-create is idempotent. Uses the postgres image (carries pgbackrest +
     stacksift-pg-overlay.sh, which materialises /etc/pgbackrest from the env). */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: stacksift-pgbackrest-stanza-create
  labels: {{- include "stacksift.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {{- include "stacksift.selector" (dict "ctx" . "component" "pgbackrest-stanza-create") | nindent 8 }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]
      containers:
        - name: stanza-create
          image: {{ include "stacksift.postgresImage" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              stacksift-pg-overlay.sh true \
                && pgbackrest --stanza=stacksift --log-level-console=info stanza-create \
                && pgbackrest --stanza=stacksift --log-level-console=info check
          env: {{- include "stacksift.pgbackrest.env" . | nindent 12 }}
          resources: {{- toYaml .Values.postgres.backups.resources | nindent 12 }}
{{- end }}
