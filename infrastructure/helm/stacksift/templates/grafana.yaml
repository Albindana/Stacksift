{{- if .Values.grafana.enabled }}
{{- if .Values.prometheus.enabled }}
{{/* Stable Service for Grafana's Prometheus datasource — selects the operator's
     Prometheus pods by their managed label (the operator only ships the headless
     prometheus-operated otherwise). */}}
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  selector:
    operator.prometheus.io/name: stacksift
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
---
{{- end }}
{{/* Datasources: Prometheus (default) + Loki (with the CorrelationId derived
     field from compose). Tempo omitted (bucket B). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels: {{- include "stacksift.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - matcherRegex: "CorrelationId\":\"([^\"]+)\""
              name: CorrelationId
              url: '/explore?left={"queries":[{"expr":"{app=\"stacksift\"} | json | CorrelationId=\"${__value.raw}\""}]}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels: {{- include "stacksift.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: StackSift
        orgId: 1
        folder: StackSift
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
{{/* The 6 dashboards (~10 KB total — one ConfigMap, well under the 1 MiB limit). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels: {{- include "stacksift.labels" . | nindent 4 }}
data:
{{- range $path, $bytes := .Files.Glob "files/grafana/dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  selector: {{- include "stacksift.selector" (dict "ctx" . "component" "grafana") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "stacksift.selector" (dict "ctx" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "stacksift.selector" (dict "ctx" . "component" "grafana") | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 472
        runAsNonRoot: true
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_SERVER_ROOT_URL, value: "https://{{ .Values.hosts.grafana }}" }
            - { name: GF_SECURITY_ADMIN_USER,     valueFrom: { secretKeyRef: { name: {{ .Values.grafana.adminSecretName }}, key: admin-user } } }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.grafana.adminSecretName }}, key: admin-password } } }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels: {{- include "stacksift.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.grafana.storageClass }}
  resources: { requests: { storage: {{ .Values.grafana.storage }} } }
{{- if .Values.grafana.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels: {{- include "stacksift.labels" . | nindent 4 }}
  annotations:
    {{ include "stacksift.certAnnoKey" . }}: {{ include "stacksift.certIssuerName" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.hosts.grafana | quote }}]
      secretName: grafana-tls
  rules:
    - host: {{ .Values.hosts.grafana }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: grafana, port: { number: 3000 } } }
{{- end }}
{{- end }}
