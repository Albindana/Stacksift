# Overlay for the project-07 / dmdailydeals.com closed-beta.
# Most of this matches the chart defaults already; this file is where you tweak
# the beta without editing values.yaml.
#
# Apply with:
#   helm upgrade --install stacksift infrastructure/helm/stacksift \
#     -n project-07 -f infrastructure/helm/stacksift/values-beta.yaml

certIssuer:
  # First issuance run: set true to use Let's Encrypt STAGING (untrusted certs,
  # but no rate limits). Once the cert flow is proven end-to-end, set false and
  # re-run to get trusted prod certs.
  useStaging: false
  email: verify@dmdailydeals.com

# Pin to the live images. Use IMMUTABLE sha tags — never the mutable
# `:dmdailydeals` (IfNotPresent won't re-pull it, and a push build can
# overwrite it with the wrong NEXT_PUBLIC_* domain).
#   - api/migrator: develop @ 7c37e80 (AI-feature fix series: ES .keyword
#     queries, incident↔analysis linkage + backfill, alert-rule severity,
#     ContextLogCount + email cooldown).
#   - frontend: sha-7c37e80 is the dmdailydeals.com-baked workflow_dispatch
#     build (domain=dmdailydeals.com, invite_only=true). The dispatch ran on
#     the same commit as the develop push build, so it REPLACED the push-built
#     stacksift.com-baked image under this tag — the dmdailydeals bake is the
#     only sha-7c37e80 frontend in the registry.
#   - marketing: sha-7c37e80 from the same dispatch (dmdailydeals bake) —
#     picks up the mobile-UX/light-mode work from PR #142.
#   - postgres: image content unchanged; keep the prior pin to avoid a
#     pointless StatefulSet restart.
#   - frontend sha-26a8757: fix/logout-redirect-origin (auth routes use the
#     configured app URL instead of the 0.0.0.0 request origin) — dmdailydeals
#     dispatch build; tag stays valid after the branch merges to develop.
images:
  api:       { tag: sha-7c37e80 }
  migrator:  { tag: sha-7c37e80 }
  postgres:  { tag: sha-2cc40a3 }
  frontend:  { tag: sha-26a8757 }
  marketing: { tag: sha-7c37e80 }

# Minimal in-namespace Prometheus + the 4 Gate-2 alerts (needs Prometheus-Operator
# CRDs, available on the cluster). Grafana/Loki deferred to bucket B.
prometheus:
  enabled: true

# pgBackRest → MinIO: DISABLED until MinIO serves TLS. pgBackRest's S3 driver
# requires HTTPS and has no plain-http option (verify-tls=n only skips cert
# *verification*); the in-namespace MinIO is plain http on :9000, so stanza-create
# fails with "TLS error: wrong version number". Re-enable once MinIO has a cert
# (then create the stacksift-pgbackrest Secret). Tracked as a follow-up.
postgres:
  backups:
    enabled: false

# ES ILM + S3 snapshots → MinIO. Needs the `stacksift-es-s3-creds` Secret (keystore
# initContainer). Repo register validates only against live ES+MinIO at deploy-time;
# set false for an absolute-minimal first stand-up (logs still flow, indices
# auto-create without ILM).
elasticsearch:
  lifecycle:
    enabled: true

# NetworkPolicy stays OFF here — apply it only AFTER the app is verified up
# (helm upgrade ... --set networkPolicy.enabled=true) so a wrong selector or the
# unknown cluster egress policy can't lock you out (DEPLOY/04 §6, DEPLOY/00 §5.5).
