name: docker-build

# Builds, scans, lints, and publishes the three application images to GHCR.
#
# Tag taxonomy (per zhelpers/PRE-DEPLOY/04-containerization/plan.md §4.7):
#   :sha-<short>   every push (any branch) — precise pin for rollback
#   :develop       push to develop          — what staging tracks
#   :main          push to main             — what prod tracks
#   :v<semver>     release tag v*.*.*       — immutable release
#   :latest        release tag v*.*.*       — floating latest stable
#
# Pull requests build and scan only — no push, so review noise stays out of
# the registry. The `if: github.event_name != 'pull_request'` guard on the
# push step enforces this.
#
# Beta CD (zhelpers/CD/plan.md): pushes to develop additionally run
#   changes     → which beta-relevant paths moved (minutes guard)
#   build-beta  → dmdailydeals.com-baked frontend/marketing, tags sha-<sha>-beta
#   deploy-beta → waits for approval on the `beta` environment, then
#                 helm-upgrades project-07 with --set image pins.
# The Helm release (helm get values stacksift -n project-07) is the
# authoritative record of live pins; values-beta.yaml carries the manual-deploy
# baseline. workflow_dispatch remains as an escape hatch for ad-hoc bakes.

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'src/marketing/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'global.json'
      - '.dockerignore'
      - 'src/backend/.dockerignore'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'src/marketing/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'global.json'
      - '.dockerignore'
      - 'src/backend/.dockerignore'
      - '.github/workflows/docker-build.yml'
      - 'src/backend/StackSift.MigrationRunner/**'
      - 'infrastructure/docker/postgres/**'

  # Manual builds for a specific public domain (frontend + marketing bake
  # NEXT_PUBLIC_* at build time). Used to produce the dmdailydeals.com beta
  # images: domain=dmdailydeals.com, extra_tag=dmdailydeals, invite_only=true.
  workflow_dispatch:
    inputs:
      domain:
        description: "Public base domain for NEXT_PUBLIC_* (e.g. dmdailydeals.com)"
        default: stacksift.com
        type: string
      extra_tag:
        description: "Extra image tag to push (e.g. dmdailydeals). Empty = none."
        default: ""
        type: string
      invite_only:
        description: "Bake NEXT_PUBLIC_REGISTRATION_INVITE_ONLY (closed beta = true)"
        default: "false"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # Which beta-relevant paths changed in this push — gates build-beta so a
  # backend-only merge doesn't rebuild the domain-baked images.
  changes:
    name: beta-paths
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      marketing: ${{ steps.filter.outputs.marketing }}
      beta_matrix: ${{ steps.matrix.outputs.value }}
      beta_any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
              - 'src/shared/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/docker-build.yml'
            marketing:
              - 'src/marketing/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/docker-build.yml'

      - name: Compose build-beta matrix
        id: matrix
        run: |
          entries=()
          if [ "${{ steps.filter.outputs.frontend }}" = "true" ]; then
            entries+=('{"service":"frontend","image":"stacksift-frontend","context":".","dockerfile":"src/frontend/Dockerfile"}')
          fi
          if [ "${{ steps.filter.outputs.marketing }}" = "true" ]; then
            entries+=('{"service":"marketing","image":"stacksift-marketing","context":".","dockerfile":"src/marketing/Dockerfile"}')
          fi
          joined=$(IFS=,; echo "${entries[*]}")
          echo "value=[${joined}]" >> "$GITHUB_OUTPUT"
          if [ "${#entries[@]}" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

  build:
    name: build-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: stacksift-api
            context: src/backend
            dockerfile: src/backend/StackSift.Api/Dockerfile
            build-args: ""
          # Only the ARGs the frontend Dockerfile actually declares are baked here.
          # KEYCLOAK_URL/APP_URL are runtime env (set in the chart's frontend.yaml),
          # NOT build-time, so they are not passed. domain defaults to stacksift.com
          # for branch pushes; workflow_dispatch overrides it (e.g. dmdailydeals.com).
          - service: frontend
            image: stacksift-frontend
            context: .
            dockerfile: src/frontend/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=https://api.${{ github.event.inputs.domain || 'stacksift.com' }}
              NEXT_PUBLIC_SIGNALR_HUB_URL=https://api.${{ github.event.inputs.domain || 'stacksift.com' }}/hubs/stacksift
              NEXT_PUBLIC_AUTH_MOCK=false
              NEXT_PUBLIC_SIGNALR_MOCK=false
              NEXT_PUBLIC_REGISTRATION_INVITE_ONLY=${{ github.event.inputs.invite_only || 'false' }}
              NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          - service: marketing
            image: stacksift-marketing
            context: .
            dockerfile: src/marketing/Dockerfile
            build-args: |
              NEXT_PUBLIC_APP_BASE_URL=https://app.${{ github.event.inputs.domain || 'stacksift.com' }}
          - service: migrator
            image: stacksift-migrator
            context: src/backend
            dockerfile: src/backend/StackSift.MigrationRunner/Dockerfile
            build-args: ""
          - service: postgres
            image: stacksift-postgres
            context: infrastructure/docker/postgres
            dockerfile: infrastructure/docker/postgres/Dockerfile
            build-args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: owner
        run: echo "value=$(echo ${{ env.IMAGE_OWNER }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # metadata-action tags images with the 7-char short SHA (format=short),
      # so scan steps must reference the same short form — using github.sha
      # (full 40 chars) yields a tag that doesn't exist and Trivy falls
      # through to a registry pull that returns DENIED.
      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Capture build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.extra_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.extra_tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=MIT

      # PR builds load into the local daemon so Trivy + Dockle can scan the
      # image before it ever reaches the registry. Push builds use the
      # registry as the cache backend so cross-job/runner cache hits work.
      - name: Build (PR — load locally, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan (HIGH,CRITICAL fail)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Dockle lint (FATAL fail)
        if: github.event_name == 'pull_request'
        uses: erzz/dockle-action@v1
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          exit-code: '1'
          failure-threshold: FATAL
          # Whitelist the GPG-key-fingerprint ENV the upstream pgvector image
          # sets at build time (CIS-DI-0010). Despite the ENV name "key" it is
          # a public PGP key fingerprint used to verify the pgvector tarball
          # signature during the upstream image build — not a credential.
          # Source: pgvector/pgvector Dockerfile, "ENV key=B97B...".
          accept-keywords: key

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy scan on pushed image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Dockle lint on pushed image
        if: github.event_name != 'pull_request'
        uses: erzz/dockle-action@v1
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          exit-code: '1'
          failure-threshold: FATAL
          accept-keywords: key

  # ---------------------------------------------------------------------------
  # build-beta — dmdailydeals.com-baked frontend/marketing for the project-07
  # closed beta. Tags carry a -beta suffix (sha-<sha>-beta, develop-beta) so
  # they never collide with the generic stacksift.com builds above. Only runs
  # for the services whose paths actually changed (see the changes job).
  # ---------------------------------------------------------------------------
  build-beta:
    name: build-beta-${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.beta_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.beta_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image owner
        id: owner
        run: echo "value=$(echo ${{ env.IMAGE_OWNER }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Compose beta build args
        id: args
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            {
              echo 'value<<EOF'
              echo 'NEXT_PUBLIC_API_URL=https://api.dmdailydeals.com'
              echo 'NEXT_PUBLIC_SIGNALR_HUB_URL=https://api.dmdailydeals.com/hubs/stacksift'
              echo 'NEXT_PUBLIC_AUTH_MOCK=false'
              echo 'NEXT_PUBLIC_SIGNALR_MOCK=false'
              echo 'NEXT_PUBLIC_REGISTRATION_INVITE_ONLY=true'
              echo 'NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'value<<EOF'
              echo 'NEXT_PUBLIC_APP_BASE_URL=https://app.dmdailydeals.com'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Capture build metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}
          flavor: |
            suffix=-beta,onlatest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            ${{ steps.args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}-beta
          cache-to: type=gha,scope=${{ matrix.service }}-beta,mode=max

      - name: Trivy scan on pushed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}-beta
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

      - name: Dockle lint on pushed image
        uses: erzz/dockle-action@v1
        with:
          image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}-beta
          exit-code: '1'
          failure-threshold: FATAL
          accept-keywords: key

  # ---------------------------------------------------------------------------
  # deploy-beta — helm-upgrade project-07 with this commit's image pins.
  # Waits for manual approval on the `beta` GitHub environment. The Helm
  # release is the authoritative record of live pins; values-beta.yaml holds
  # the manual-deploy baseline. postgres is never auto-pinned (StatefulSet
  # restart stays a human decision). Rollback: re-run an older green deploy
  # job, or `helm rollback stacksift <rev> -n project-07`.
  # ---------------------------------------------------------------------------
  deploy-beta:
    name: deploy-beta
    runs-on: ubuntu-latest
    needs: [changes, build, build-beta]
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop' &&
      needs.changes.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.build-beta.result == 'success' || needs.build-beta.result == 'skipped')
    environment:
      name: beta
      url: https://app.dmdailydeals.com
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Compose helm --set pins
        id: pins
        run: |
          short='${{ steps.sha.outputs.short }}'
          pins="--set images.api.tag=sha-${short} --set images.migrator.tag=sha-${short}"
          summary="api=sha-${short} migrator=sha-${short}"
          if [ "${{ needs.build-beta.result }}" = "success" ] && [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            pins="${pins} --set images.frontend.tag=sha-${short}-beta"
            summary="${summary} frontend=sha-${short}-beta"
          fi
          if [ "${{ needs.build-beta.result }}" = "success" ] && [ "${{ needs.changes.outputs.marketing }}" = "true" ]; then
            pins="${pins} --set images.marketing.tag=sha-${short}-beta"
            summary="${summary} marketing=sha-${short}-beta"
          fi
          echo "value=${pins}" >> "$GITHUB_OUTPUT"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"

      - name: Write kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.BETA_KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade
        run: |
          helm upgrade --install stacksift infrastructure/helm/stacksift \
            -n project-07 \
            -f infrastructure/helm/stacksift/values-beta.yaml \
            ${{ steps.pins.outputs.value }} \
            --wait --timeout 10m

      - name: Smoke test
        run: |
          kubectl rollout status deploy/api -n project-07 --timeout=180s
          kubectl rollout status deploy/frontend -n project-07 --timeout=180s
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            -o /dev/null https://api.dmdailydeals.com/health/ready
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            -o /dev/null https://app.dmdailydeals.com/api/healthz
          echo "smoke OK"

      - name: Run summary
        if: always()
        run: |
          {
            echo "## Beta deploy — ${{ steps.sha.outputs.short }}"
            echo ""
            echo "Pins: \`${{ steps.pins.outputs.summary }}\` (postgres untouched)"
            echo ""
            echo "Helm release:"
            echo '```'
            helm list -n project-07 | tail -1 || true
            echo '```'
            echo ""
            echo "Live pins are recorded in the release: \`helm get values stacksift -n project-07\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # notify — post the beta-deploy outcome to Slack (#stacksift-ci). Completes the
  # DO-4 "lint → test → build → push → deploy → notify" pipeline. Skips silently
  # until SLACK_CI_WEBHOOK_URL is configured as a repo secret.
  # ---------------------------------------------------------------------------
  notify:
    name: notify
    runs-on: ubuntu-latest
    needs: [deploy-beta]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
    steps:
      - name: Slack — deploy result
        if: env.SLACK_CI_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ env.SLACK_CI_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ needs.deploy-beta.result == 'success' && ':white_check_mark:' || ':x:' }} beta deploy ${{ needs.deploy-beta.result }} — ${{ github.sha }} by ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run> · https://app.dmdailydeals.com"
            }
